  var data = [{"title": "流量卡怎么办理？先想清楚这四件事", "page": 1, "url": "index.html", "text": "办卡入口放这儿，省得你翻：https://web.haokalingqu.com/home/c8570adcb7030e9b 有人私信我一句「卡卡，那个卡在哪办」，我一般不直接甩链接，先反问一句：你自己用，还是给家里人办？ 这不是客套。这两种情况，选卡逻辑完全不一样。 自己用，大概率是当副卡：主卡保号接电话，副卡专门跑流量。那你的容错率很高，号码丑点、归属地不是本地，都无所谓，能用就行。给爸妈办就不一样了，他们可能连「激活」这一步都要你在电话里教半小时，还得考虑他们会不会自己去销户。 所以「怎么办理」这个问题，真正的难点不在流程，在办之前你有没有想清楚几件事。 **第一件：这张卡是干什么用的。** 只上网，和要绑微信支付宝、要收银行验证码，是两个世界的事。前者随便挑，后者你得考虑归属地、能不能长期用、以后销户方不方便。我的建议一直是：主号别动，办张纯流量的副卡，出事了大不了扔了，不心疼。 **第二件：从哪办。** 三条路。运营商官方渠道（App、营业厅、官方小程序），电商平台旗舰店，还有就是代理渠道——比如我博客上挂的那种。 官方渠道的好处是明码标价、售后有门，缺点是线上那种便宜套餐，你在官方页面里往往搜不到，它们是走推广渠道放的。代理渠道拿的就是这类套餐，便宜是真的，但售后得提前问清楚：出问题找谁，找运营商客服还是找推你的人。 我不觉得代理渠道就一定坑，但你要接受一个事实——推你的人赚的是佣金，他的利益和你的利益不完全一致。这话不好听，但是实话。 **第三件：下单要准备什么。** 身份证正反面照片、人脸识别、一个能收验证码的手机号，还有收货地址。这里有个细节很多人栽：收货人必须和办卡人一致。你用自己的身份证给老家的爸妈办、寄到老家让邻居代收，大概率审核不过。 还有一种审核不过的情况，是你名下这个运营商的号已经到上限了，或者有欠费没清。这个不是卡的问题，是你自己的账没结干净，先去查。 **流程本身其实很短。** 下单 → 审核 → 发货 → 收货激活 → 首充 → 套餐生效。 多数是专属物流，要本人签收。有的是快递员现场帮你激活，有的是收到后自己扫码弄。激活之后通常还要充一笔钱，这一步最容易漏——很多人以为激活完就完事了，结果宣传的套餐价没生效，扣的是原价。 还有个时间限制要注意：卡寄到之后有个激活期限，放着不管，过期就作废了，钱退不退还得看渠道。所以别一次性办好几张囤着。 卡板别急着扔，上面印着号码和说明，后面查东西、找客服报信息都得用。 **然后是我认为最该看、但大家最不看的一项：优惠期。** 宣传页上那个价格，绝大多数是「前几个月」的价格。过了这段时间恢复原价，你不主动改套餐，它就那么扣着，扣到你发现为止。 所以下单前我建议你按这个顺序核一遍： 优惠期多长 → 首充门槛多少 → 有没有合约期 → 销户要不要跑营业厅、能不能异地销户 → 最后才看流量有多少 G。 顺序反过来的人，最后基本都在吐槽「被骗了」。其实不是被骗，是规则写在角落里，你没看。 说句实在的，流量卡这行没什么高科技，拼的就是信息差，和你愿不愿意花十分钟把规则看清楚。你现在花十分钟，比以后打三次客服强。 想省事的，我博客首页那个链接里都是我自己筛过的。但上面那几条，你还是自己核一遍再下单。 别信我，信规则。 我上周刚办一张，快递员上门激活的，当场让我扫码充了钱，说是不充套餐不生效。我当时有点懵，但想想也合理，反正钱是自己的话费。提醒一句，激活的时候把卡板留着，上面有号码，后面查东西要用。 不太同意楼主说的代理渠道。我宁可多花点钱走官方 App，至少出问题打客服有人接。之前在某代"}], q = document.getElementById('q'),
