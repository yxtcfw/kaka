<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索 · 卡卡流量卡</title>
<meta name="description" content="站内搜索">
<link rel="stylesheet" href="style.css">
<link rel="alternate" type="application/rss+xml" title="卡卡流量卡" href="feed.xml">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./">卡卡流量卡</a>
  <nav class="nav"><a href="./">首页</a><a href="archive.html">归档</a><a href="tags/">标签</a><a href="search.html">搜索</a></nav>
</header>
<main class="wrap ">
<h1 class="site-title">搜索</h1>
<p class="site-tagline">共 0 篇</p>
<p class="site-tagline"><a href="https://web.haokalingqu.com/home/c8570adcb7030e9b">今日好卡，点击领卡<<</a></p>
<form class="search-box" onsubmit="return false;">
  <input id="q" type="search" placeholder="输入关键词，比如：推荐、测评" autocomplete="off" autofocus>
</form>
<p id="hint" class="site-tagline">输入关键词开始搜。</p>
<ul id="results" class="list"></ul>
<script>
(function(){
  var data = [], q = document.getElementById('q'),
      out = document.getElementById('results'), hint = document.getElementById('hint');
  function run(){
    var kw = q.value.trim().toLowerCase();
    if(!kw){ out.innerHTML=''; hint.textContent='输入关键词开始搜。'; return; }
    var hits = data.filter(function(p){
      return (p.title+' '+p.summary+' '+p.tags.join(' ')+' '+p.text).toLowerCase().indexOf(kw) > -1;
    }).slice(0, 40);
    hint.textContent = '找到 ' + hits.length + ' 篇';
    out.innerHTML = hits.map(function(p){
      return '<li class="card"><a href="'+p.url+'"><h2>'+p.title+'</h2><p>'+(p.summary||'')+'</p>'+
             '<div class="meta">'+p.date+' · '+(p.tags||[]).join(' / ')+'</div></a></li>';
    }).join('');
  }
  q.addEventListener('input', run);
})();
</script>
</main>
<footer class="foot">
  <p>卡卡流量卡 · 每天一篇，分享好卡</p>
  <p class="small"><a href="feed.xml">RSS</a> · 由 GitHub Actions 每天自动生成</p>
</footer>
</body>
</html>
