<body>
<header class="topbar">
  <a class="brand" href="index.html">卡卡流量卡</a>
  <span class="board">专注于流量卡的长篇帖子。</span>
</header>
<main class="wrap">
<h1 class="page-title">搜索</h1>
<div class="page-meta">全站 1 页</div>
<form class="search-box" onsubmit="return false;">
  <input id="q" type="search" placeholder="输入关键词，比如：小程序、自动化、备份" autocomplete="off" autofocus>
</form>
<p id="hint" class="site-tagline">输入关键词开始搜。</p>
<ul id="results" class="list"></ul>
<script>
(function(){
  var data = [{"title": "流量卡办理，先问清合约期", "page": 1, "url": "index.html", "text": "流量卡如何办理 宿舍宽带到期了，不想再拉线。搜“流量卡”出来全是“点击领取”，点进去要填手机号，填完就有人打电话。我想知道正规流程到底长什么样。 渠道就两类：运营商官方 App 或营业厅，还有代理商发的链接。前者贵一点，但订单在官方能查、能退；后者便宜，卡寄到之前你根本不知道是哪家运营商发的。下单前先问一句“归属地是哪、能不能在官方 App 查到订单”，对方一犹豫就别办。 线上办卡躲不掉实名，身份证正反面加人脸，这是硬性要求。但凡是让你手持身份证拍照、或者把身份证照片发微信的，直接退，正规流程里没有这一步。 那“首月 0 元”这种是套路吗？我看好多都这么写。 多数是把月租摊到后面几个月，或者要求你在网满 12 个月，提前销号要补差价。所以别盯首月，问两句就够：合约期多久、违约金怎么算。宣传页上不会写这两条。 我的做法是不在电商详情页下单，去运营商官方小程序搜“号卡”，能选号、能看到完整套餐页。缺点是号段少，热门号基本没有，想挑号的人会失望。 先想清楚是主卡还是副卡。副卡根本不用换号，办张纯流量卡插副卡槽，主卡降到最低保号套餐。我这么用了两年，麻烦事少一半，代价是手机得支持双卡。 提醒个坑：收到卡别急着激活。先看包装上的运营商和套餐名，跟下单页面的截图对一遍，对不上直接拒收。激活之后再想退，流程能拖到你放弃。 问个具体的：那种宣传“19 元 100G”的卡，用三个月后限速到 1Mbps，这种续费还划算吗？ 再问一个：办卡选号的时候，靓号是不是都绑了最低消费？有没有不绑的渠道？"}], q = document.getElementById('q'),
      out = document.getElementById('results'), hint = document.getElementById('hint');
  function run(){
    var kw = q.value.trim().toLowerCase();
    if(!kw){ out.innerHTML=''; hint.textContent='输入关键词开始搜。'; return; }
    var hits = data.filter(function(p){
      return (p.title+' '+p.text).toLowerCase().indexOf(kw) > -1;
    }).slice(0, 40);
    hint.textContent = '找到 ' + hits.length + ' 页';
    out.innerHTML = hits.map(function(p){
      var t = p.text.replace(/</g,'&lt;');
      var idx = t.toLowerCase().indexOf(kw);
      var snip = idx > -1 ? t.slice(Math.max(0, idx-40), idx+80) : t.slice(0, 80);
      return '<li class="card"><a href="'+p.url+'"><h2>第 '+p.page+' 页 · '+p.title+'</h2>'+
             '<p>…'+snip+'…</p></a></li>';
    }).join('');
  }
  q.addEventListener('input', run);
})();
</script>
