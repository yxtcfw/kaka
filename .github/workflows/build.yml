name: rebuild-site

# 你本地改了 md / 配置 / 样式并 push，自动重建整站
on:
  push:
    branches: [main, master]
    paths:
      - 'docs/posts/**'
      - 'docs/**/*.md'
      - 'docs/style.css'
      - 'scripts/blogsite.py'
      - 'scripts/compositor.py'
      - 'scripts/navsite.py'
      - 'scripts/resourcesite.py'
      # 注意：config/** 由 fetch_config.py 在 daily 工作流里写入，
      # 故意不加入触发路径，避免“拉取配置 → 提交通知 → 重建 → 提交”循环
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 重建整站
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python scripts/generate.py --rebuild

      - name: 提交生成结果
        run: |
          git config user.name  "rebuild-bot"
          git config user.email "rebuild-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "页面无变化，跳过提交"
          else
            git commit -m "chore: 重建站点 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
