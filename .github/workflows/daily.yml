name: daily-post

on:
  schedule:
    # 北京时间 07:00 / 11:00 / 15:00 / 19:00
    - cron: '0 23,3,7,11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto=拉取配置并写作 / probe=只测采集源 / rebuild=只重建整站'
        required: false
        default: 'auto'
        type: choice
        options: [auto, probe, rebuild]
      keyword:
        description: '直接指定主题（留空则自动选题）'
        required: false
        type: string
      model:
        description: '留空即用全部免费模型轮换'
        required: false
        type: string
  repository_dispatch:
    types: [site-config-updated]

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 只处理发给自己的 dispatch 事件
      - name: 检查 dispatch 目标
        id: dispatch_check
        env:
          EVENT_SITE: ${{ github.event.client_payload.site_id }}
        run: |
          if [ -n "$EVENT_SITE" ] && [ "$EVENT_SITE" != "kaka" ]; then
            echo "事件属于 $EVENT_SITE，跳过本站"
            echo "matched=false" >> "$GITHUB_OUTPUT"
          else
            echo "matched=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取主站配置
        id: fetch
        if: ${{ steps.dispatch_check.outputs.matched != 'false' && (github.event_name == 'repository_dispatch' || github.event.inputs.mode == 'auto' || github.event.inputs.mode == '' || github.event.inputs.mode == 'probe') }}
        env:
          SITE_ID: kaka
        run: python scripts/fetch_config.py

      - name: 采集源自检
        if: ${{ github.event.inputs.mode == 'probe' }}
        run: python scripts/generate.py --probe

      - name: 只重建整站（不写作）
        if: ${{ github.event.inputs.mode == 'rebuild' }}
        run: python scripts/generate.py --rebuild

      - name: 选题 + 写作 + 建站（单次 AI 请求）
        id: gen
        if: ${{ steps.dispatch_check.outputs.matched != 'false' && steps.fetch.outcome == 'success' && (github.event_name == 'repository_dispatch' || github.event.inputs.mode == 'auto' || github.event.inputs.mode == '') }}
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ github.event.inputs.model || vars.OPENROUTER_MODEL || 'free' }}
          FORCE_KEYWORD: ${{ github.event.inputs.keyword }}
          WORD_COUNT: ${{ vars.WORD_COUNT || '1600' }}
          FREE_ONLY: ${{ vars.FREE_ONLY || '1' }}
          MODEL_BUDGET_SECONDS: ${{ vars.MODEL_BUDGET_SECONDS || '600' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python scripts/generate.py

      - name: 提交并推送
        if: ${{ steps.dispatch_check.outputs.matched != 'false' && (steps.gen.outcome == 'success' || github.event.inputs.mode == 'rebuild') }}
        run: |
          git config user.name  "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add docs config/generated.json config/names.json config/ads.json config/sources.json config/writing.json config/site.json config/keywords.txt config/theme.json
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "post: $(TZ=Asia/Shanghai date +%Y-%m-%d) 自动更新"
            git push
          fi

      - name: 回写状态到主站
        if: ${{ always() && steps.dispatch_check.outputs.matched != 'false' && github.event_name != 'pull_request' }}
        env:
          MAIN_STATUS_TOKEN: ${{ secrets.MAIN_STATUS_TOKEN }}
          SITE_ID: kaka
          RUN_RESULT: ${{ (steps.fetch.outcome == 'failure' || steps.gen.outcome == 'failure') && 'failed' || 'success' }}
          ERROR_MESSAGE: ${{ steps.gen.outputs.error || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f docs/.run_stat.json ]; then
            export PAGES=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('pages',0))")
            export FLOORS=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('floors',0))")
            export WORDS=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('words',0))")
            export MODEL=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('model',''))")
            export AI_CALLS=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('ai_calls',0))")
          fi
          python scripts/writeback_status.py

      - name: 推送结果到企业微信
        if: ${{ always() && steps.dispatch_check.outputs.matched != 'false' && (github.event.inputs.mode == 'auto' || github.event.inputs.mode == '' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch') }}
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          STATUS: ${{ steps.gen.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python scripts/notify.py
