name: daily-post

on:
  schedule:
    # 北京时间 07:00 / 11:00 / 15:00 / 19:00
    - cron: '0 23,3,7,11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto=生成本站配置并写作 / probe=只测采集源 / rebuild=只重建整站'
        required: false
        default: 'auto'
        type: choice
        options: [auto, probe, rebuild]
      keyword:
        description: '直接指定主题（留空则自动选题）'
        required: false
        type: string
      model:
        description: '留空即用全部免费模型轮换'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 站点自包含：只读本站 config/，不再从主站拉取配置。
      - name: 生成本站运行配置
        id: runtime
        run: python scripts/build_runtime.py

      - name: 采集源自检
        if: ${{ github.event.inputs.mode == 'probe' }}
        run: python scripts/generate.py --probe

      - name: 只重建整站（不写作）
        if: ${{ github.event.inputs.mode == 'rebuild' }}
        run: python scripts/generate.py --rebuild

      - name: 选题 + 写作 + 建站（单次 AI 请求）
        id: gen
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'auto' || github.event.inputs.mode == '' }}
        continue-on-error: true
        env:
          # 集中式写作网关：Key 只在主站，本站只持有 dispatch/读回写的 token
          # 账号级 Classic PAT（repo 权限）统一跨仓使用；旧 GATEWAY_TOKEN 保留兼容。
          GATEWAY_MODE: central
          GATEWAY_TOKEN: ${{ secrets.ACCOUNT_TOKEN || secrets.GATEWAY_TOKEN }}
          # 读回写文件用本站 GITHUB_TOKEN（自带 contents:read），无需 GATEWAY_TOKEN 具备读权限
          GITHUB_TOKEN: ${{ github.token }}
          GATEWAY_REPO: yxtcfw/yxtcfw.github.io
          GATEWAY_EVENT: writing_request
          GATEWAY_POLL_TIMEOUT: ${{ vars.GATEWAY_POLL_TIMEOUT || '600' }}
          SITE_ID: kaka
          SITE_REPO: yxtcfw/kaka
          SITE_BRANCH: main
          # 本地直连 fallback 用（GATEWAY_TOKEN 缺失时 generate.py 自动回退）
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ github.event.inputs.model || vars.OPENROUTER_MODEL || 'free' }}
          FORCE_KEYWORD: ${{ github.event.inputs.keyword }}
          WORD_COUNT: ${{ vars.WORD_COUNT || '1600' }}
          FREE_ONLY: ${{ vars.FREE_ONLY || '1' }}
          MODEL_BUDGET_SECONDS: ${{ vars.MODEL_BUDGET_SECONDS || '600' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python scripts/generate.py

      - name: 提交并推送
        id: commit
        if: ${{ steps.gen.outcome == 'success' || github.event.inputs.mode == 'rebuild' }}
        run: |
          git config user.name  "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          # 配置源、生成本地运行配置、内容树状态流转都需要提交，保证仓库自包含。
          git add docs config/generated.json config/writing.json config/keywords.txt config/tree.json
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "post: $(TZ=Asia/Shanghai date +%Y-%m-%d) 自动更新"
            # 网关回写结果可能与本次写作并发提交到 main，推送前先 rebase 再推。
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: 回写状态到主站
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          # 账号级 Classic PAT（repo 权限）统一跨仓使用；旧 MAIN_STATUS_TOKEN 保留兼容。
          MAIN_STATUS_TOKEN: ${{ secrets.ACCOUNT_TOKEN || secrets.MAIN_STATUS_TOKEN }}
          SITE_ID: kaka
          RUN_RESULT: ${{ (steps.runtime.outcome == 'failure' || steps.gen.outcome == 'failure' || steps.commit.outcome == 'failure') && 'failed' || 'success' }}
          ERROR_MESSAGE: ${{ steps.gen.outputs.error || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f docs/.run_stat.json ]; then
            export PAGES=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('pages',0))")
            export FLOORS=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('floors',0))")
            export WORDS=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('words',0))")
            export MODEL=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('model',''))")
            export AI_CALLS=$(python -c "import json;print(json.load(open('docs/.run_stat.json')).get('ai_calls',0))")
          fi
          python scripts/writeback_status.py

      - name: 推送结果到企业微信
        if: ${{ always() && (github.event.inputs.mode == 'auto' || github.event.inputs.mode == '' || github.event_name == 'schedule') }}
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          STATUS: ${{ (steps.gen.outcome == 'failure' || steps.commit.outcome == 'failure') && 'failure' || 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python scripts/notify.py
