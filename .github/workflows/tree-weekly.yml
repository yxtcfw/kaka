name: tree-weekly

# 建树独立周任务：树是信息架构，不进每日 pipeline。
# 运行节奏：每周一 UTC 03:00（北京时间 11:00）+ 手动 dispatch。
# 每日 pipeline 只在超过 rules/tree-cadence.json 的 overdueDays 时兜底补跑一次。
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: '绕过阈值门槛直接建树（首次建树/阈值调整后使用）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  grow-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Python 适配器依赖
        run: pip install -r requirements.txt

      - name: 注入密钥（只走 env，永不落文件）
        run: |
          echo "已注入的密钥指纹（不打印明文）："
          node -e "for (const k of ['OPENROUTER_API_KEYS','TAVILY_API_KEY','EXA_API_KEY','DEEPSEEK_API_KEY','DASHSCOPE_API_KEY','BING_API_KEY']) { const v=process.env[k]||''; console.log(k, v ? 'set('+v.length+')' : 'unset') }"
        env:
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}

      - name: 校验数据契约
        run: node scripts/cli.js validate

      - name: 采集最新联想词
        run: node scripts/cli.js harvest
        env:
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}

      - name: 建树（受阈值门槛，dispatch 可 force）
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            node scripts/cli.js grow-tree --force
          else
            node scripts/cli.js grow-tree
          fi
        env:
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

      - name: 提交数据回仓
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: weekly tree update [skip ci]"
            git push
          fi
