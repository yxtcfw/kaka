name: pipeline

# 采集→建树→信源→创作→构建 全链（达标驱动）。
# 运行节奏：push + 定时（cron）+ 手动。push 触发使每次代码更新即云端自检；
# 回仓数据提交带 [skip ci]，不会造成循环。cron 作兜底（公开仓 60 天无提交会停 cron）。
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # workflow_run 触发的下游（deploy.yml）权限不能超过上游，故同步声明 Pages 权限。
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 无 key 搜索（ddgs）与 site: 收录估算走 Python 适配器，云端需装依赖。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Python 适配器依赖
        run: pip install -r requirements.txt

      - name: 注入密钥（只走 env，永不落文件）
        run: |
          echo "已注入的密钥指纹（不打印明文）："
          node -e "for (const k of ['OPENROUTER_API_KEYS','TAVILY_API_KEY','EXA_API_KEY','DEEPSEEK_API_KEY','DASHSCOPE_API_KEY','GSC_SERVICE_ACCOUNT','BING_API_KEY']) { const v=process.env[k]||''; console.log(k, v ? 'set('+v.length+')' : 'unset') }"
        env:
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}

      - name: 校验数据契约
        run: node scripts/cli.js validate

      - name: 运行全链
        run: node scripts/cli.js pipeline
        env:
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}

      - name: 生成周报
        run: node scripts/cli.js report

      # 注意：GITHUB_TOKEN 提交默认不触发其他 workflow。
      # 这里显式提交数据回仓；构建验收靠 workflow_run 链式（见 build-check workflow），不能指望 push 事件。
      - name: 提交数据回仓
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: pipeline data update [skip ci]"
            git push
          fi
