name: build-check

# 云端构建验收（全部在 GitHub 内完成，不外发部署）。
# 用 workflow_run 链式，正面处理「GITHUB_TOKEN 提交不触发 workflow」的坑：
# 在 pipeline 完成后触发，校验的是 pipeline 已提交回仓的最新数据能否独立 build。
on:
  workflow_run:
    workflows: ["pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 独立构建自检：clone 即可 build 的硬验收，不进任何部署链。
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate + build
        run: |
          node scripts/cli.js validate
          node scripts/cli.js build
      - name: 断言产物齐全
        run: test -f _site/index.html && test -f _site/sitemap.xml && echo "build artifacts OK"
