name: grow-tree

on:
  schedule:
    # 北京时间每周一 08:00（UTC 周一 00:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grow-tree
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 联想词接口偶发不可用时脚本静默退出（返回 0），不阻断任何发文流程。
      - name: 采集联想词并生长内容树
        id: grow
        run: python scripts/grow_tree.py

      - name: 提交并推送
        if: ${{ steps.grow.outcome == 'success' }}
        run: |
          git config user.name  "grow-tree-bot"
          git config user.email "grow-tree-bot@users.noreply.github.com"
          git add config/tree.json
          if git diff --cached --quiet; then
            echo "没有新节点，跳过提交"
          else
            git commit -m "chore(tree): 自动补充联想词节点 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            # 与 daily-post 并发写 main 时先 rebase 再推
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
